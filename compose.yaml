name: oakboard

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oakboard:${OAKBOARD_IMAGE_TAG:-latest}
    container_name: oakboard-app
    restart: unless-stopped
    init: true
    ports:
      # Never publish OakBoard on 80/443: cPanel already owns those ports.
      - "127.0.0.1:${OAKBOARD_HTTP_PORT:-8180}:80"
    environment:
      OAKBOARD_CONFIG_FILE: /run/oakboard/oakboard-config.php
      OAKBOARD_RELEASE: ${OAKBOARD_RELEASE:-local}
    volumes:
      - type: bind
        source: ${OAKBOARD_CONFIG_PATH:-/home/ostech/oakboard-config.php}
        target: /run/secrets/oakboard-config.source.php
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      # Available when cPanel MySQL is reachable through the Docker host.
      - "host.docker.internal:host-gateway"
    networks:
      - oakboard

networks:
  oakboard:
    name: oakboard
    driver: bridge
